#################################
#             Shadows           #
#################################

# Cienie całkowicie wyłączone
shadow = false;

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 1.0;

#################################
#           Corners             #
#################################

# Brak zaokrągleń - ostre krawędzie wszędzie
corner-radius = 0;

#################################
#    FAST SNAPPY ANIMATIONS     #
#################################

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.20;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.20;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.30;
  }
);

#################################
#       General Settings        #
#################################

backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

#################################
#         Window Rules          #
#################################

rules: ({
  # Wyłączenie renderowania obszarów GTK (naprawia ramki w Firefox)
  match = "_GTK_FRAME_EXTENTS@";
  shadow = false;
  corner-radius = 0;
}, {
  # Menus, dialogs, tooltips: no animation, no fade
  match = "window_type = 'popup_menu'    || "
          "window_type = 'dropdown_menu' || "
          "window_type = 'tooltip'       || "
          "window_type = 'dialog'";
  fade = false;
  animations = false;
}, {
  # Menus and tooltips: slight transparency
  match = "window_type = 'popup_menu'    || "
          "window_type = 'dropdown_menu' || "
          "window_type = 'tooltip'";
  opacity = 0.95;
}, {
  # Dim unfocused windows (but not the DWM bar)
  match = "!focused && class_g != 'dwm'";
  opacity = 0.95;
}, {
  # DWM bar: fully opaque, no fade, no animations
  match = "class_g = 'dwm'";
  opacity = 1.0;
  fade = false;
  animations = false;
}, {
  # Geany opacity
  match = "class_g = 'Geany'";
  opacity = 0.95;
}, {
  # dmenu: fully opaque, no fade, no animations
  match = "class_g = 'dmenu'";
  opacity = 1.0;
  fade = false;
  animations = false;
})

